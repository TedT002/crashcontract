[package]
name = "cc-cli"
description = "CrashContract komut satırı: run / replay / minimize"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "crashcontract"
path = "src/main.rs"

[dependencies]
# Op tipi.
cc-model = { path = "../cc-model" }
# CrashConfig.
cc-trace = { path = "../cc-trace" }
# StorageAdapter + runner.
cc-adapter = { path = "../cc-adapter" }
# Seed'li iş yükü.
cc-workload = { path = "../cc-workload" }
# Test edilen motor(lar).
toy-correct = { path = "../../engines/toy-correct" }
# Gerçek motor (Aşama 7): redb, ayrı sürücü sürecinde + LD_PRELOAD shim.
redb-engine = { path = "../../engines/redb-engine" }
# Bulgu küçültme (ddmin).
cc-minimize = { path = "../cc-minimize" }
# serde + serde_json: yeniden oynatılabilir JSON rapor (Aşama 6). JSON'u elle yazmak/okumak
# hataya açık; serde_json fiili standart ve yalnız bu crate'te.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Rapor testleri her mutantın kataloğundaki yapılandırmayı kullanır.
toy-mutants = { path = "../../engines/toy-mutants" }

[lints]
workspace = true
