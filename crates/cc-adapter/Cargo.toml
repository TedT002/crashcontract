[package]
name = "cc-adapter"
description = "CrashContract StorageAdapter trait'i: test edilen motorun sözleşmesi ve işlem uygulayıcı"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Op/History/Guarantees tipleri: adaptör motoru modelin diliyle konuşturur.
cc-model = { path = "../cc-model" }
# TraceLog: apply_op her işlemin iz aralığını (span) çizer.
cc-trace = { path = "../cc-trace" }
# SplitMix64: runner'ın kesme örneklemesi iş yükü üreteciyle aynı PRNG'yi kullanır.
cc-workload = { path = "../cc-workload" }
# serde: FailureCase/RunConfig JSON rapora girer.
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
