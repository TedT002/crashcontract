[package]
name = "cc-workload"
description = "CrashContract seed'li iş yükü üreteci (PUT/GET/DELETE/txn/sync)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Op/Write tipleri: üretilen iş yükü modelin dilinde.
cc-model = { path = "../cc-model" }
# serde: üreteç yapılandırması JSON rapora girer (Aşama 6).
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
