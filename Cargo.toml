[workspace]
resolver = "3"
# Açık liste: her crate kendi aşamasında buraya eklenir (glob yok — bkz. SPEC §0.2).
members = [
    "crates/cc-model",
    "crates/cc-trace",
    "crates/cc-adapter",
    "crates/cc-workload",
    "crates/cc-minimize",
    "crates/cc-shim",
    "crates/cc-cli",
    "engines/toy-correct",
    "engines/toy-mutants",
    "engines/redb-engine",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.lints.rust]
# Yalnızca cc-shim (Aşama 7, LD_PRELOAD) crate seviyesinde gerekçeli #![allow(unsafe_code)] ile açar.
# "forbid" değil "deny": forbid, crate seviyesinde allow ile geçersiz kılınamaz.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# redb'nin `debug_assertions` dalları disk görüntüsünü derleme profiline bağımlı kılıyor (ölçüldü:
# aynı iş yükünde debug ve release sürücülerin yazdığı başlıkta 48 bayt fark). Raporların her
# profilde bire bir replay edilebilmesi için redb her profilde aynı derlenir; testler de hızlanır.
[profile.dev.package.redb]
debug-assertions = false
opt-level = 3
